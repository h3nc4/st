name: Build st

# Nobody pushes to a fork for months, so the weekly run is what catches a toolchain
# that stopped compiling it. Pushes to h3nc4 go through release.yaml, which builds
# the same way.
on:
  pull_request:
    branches:
      - "h3nc4"
      - "deps"
  schedule:
    - cron: "21 5 * * 1" # Weekly, on Mondays
  workflow_dispatch:

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ needs.image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the checks
        run: ./scripts/ci.sh

  deb:
    name: Build the .deb
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git make gcc libc6-dev \
            pkg-config libx11-dev libxft-dev dpkg-dev lintian
          git config --system --add safe.directory '*'
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the .deb
        run: ./scripts/deb.sh dist
      - name: Run lintian
        run: lintian --fail-on warning --pedantic dist/*.deb
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  install-debian:
    name: Install on Debian trixie
    runs-on: ubuntu-latest
    needs: deb
    container:
      image: debian:trixie@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
          path: dist
      - name: Install and purge the .deb
        run: ./scripts/check-deb.sh dist

  install-devuan:
    name: Install on Devuan excalibur
    runs-on: ubuntu-latest
    needs: deb
    container:
      image: devuan/devuan:excalibur@sha256:a4a7d8a444def6122f92d3bf895b5bab6da065c04efb1c72b91700e8b59fa6f2
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
          path: dist
      - name: Install and purge the .deb
        run: ./scripts/check-deb.sh dist
